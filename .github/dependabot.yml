version: 2
registries:
  maven-central:
    type: "maven-repository"
    url: "https://repo.maven.apache.org/maven2/"
  architectury-maven:
    type: "maven-repository"
    url: "https://maven.architectury.dev/"
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - "maven-central"
      - "architectury-maven"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "gradle"
    directory: "/common"
    registries:
      - "maven-central"
      - "architectury-maven"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "gradle"
    directory: "/fabric"
    registries:
      - "maven-central"
      - "architectury-maven"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "gradle"
    directory: "/neoforge"
    registries:
      - "maven-central"
      - "architectury-maven"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
